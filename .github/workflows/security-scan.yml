name: Security Scan
# iVPL OS engineering-standards baseline — secret scanning in CI (gitleaks).
# Language-agnostic: scans only NEW commits (push/PR range), so it catches new
# leaks going forward without failing CI on any pre-existing history.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 needs a paid org licence; use the CLI binary directly.
      - name: Detect secrets (gitleaks CLI)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          case "$RANGE" in 0000000*|..*|*..0000000*) RANGE="${{ github.sha }}~1..${{ github.sha }}" ;; esac
          echo "Scanning range: $RANGE"
          /tmp/gitleaks detect --source . --log-opts="$RANGE" --redact --no-banner --exit-code 1
